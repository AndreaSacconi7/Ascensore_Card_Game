# Static analysis configuration. See https://dart.dev/guides/language/analysis-options
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # CommandType / MessageType / Seed values are serialized by name and must
    # match the SCREAMING_CASE enums of the Java server exactly.
    constant_identifier_names: false

formatter:
  page_width: 120
